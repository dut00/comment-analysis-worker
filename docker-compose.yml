name: comment-analysis

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: comment_analysis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Host port 5433 to avoid clashing with a locally running PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d comment_analysis"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      # Management UI: http://localhost:15672 (guest / guest)
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: src/CommentAnalysis.Worker/Dockerfile
    image: comment-analysis-worker:local
    environment:
      Model__Provider: Static
      Database__ConnectionString: Host=postgres;Port=5432;Database=comment_analysis;Username=postgres;Password=postgres
      Database__MigrateOnStartup: "true"
      RabbitMq__Uri: amqp://guest:guest@rabbitmq:5672/
    ports:
      # Host port 5080: 8080 is often taken on developer machines.
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
