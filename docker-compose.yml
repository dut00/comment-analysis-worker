# Local development stack. Credentials are development defaults; ports are bound to localhost only.
# Images are pinned to patch versions, the same as in the integration tests (PostgresFixture, RabbitMqFixture).
name: comment-analysis

services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: comment_analysis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Host port 5433 to avoid clashing with a locally running PostgreSQL on 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d comment_analysis"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3.6-management
    ports:
      - "127.0.0.1:5672:5672"
      # Management UI: http://localhost:15672 (guest / guest)
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: src/CommentAnalysis.Worker/Dockerfile
    image: comment-analysis-worker:local
    environment:
      # The decision model runs on the host (a /v1/systemone server on port 1234, listening beyond localhost).
      # Use Model__Provider: Static to run without it.
      Model__Provider: SystemOne
      Model__SystemOne__BaseUrl: http://host.docker.internal:1234/v1/
      Model__SystemOne__Model: basal-2.0-mini
      Model__SystemOne__Version: "2.0"
      # The local model serves one request at a time; more prefetched messages only wait unacked towards
      # consumer_timeout (30 min).
      Consumer__Prefetch: "1"
      Database__ConnectionString: Host=postgres;Port=5432;Database=comment_analysis;Username=postgres;Password=postgres
      Database__MigrateOnStartup: "true"
      RabbitMq__Uri: amqp://guest:guest@rabbitmq:5672/
      # The worker runs as Production and requires TLS to both; the compose network is private to this machine.
      Database__AllowPlaintext: "true"
      RabbitMq__AllowPlaintext: "true"
      # Metrics are exported only when an OTLP (gRPC) endpoint is set, e.g. the dashboard below:
      # WORKER_OTLP_ENDPOINT=http://aspire-dashboard:18889 docker compose --profile observability up -d
      # (not OTEL_EXPORTER_OTLP_ENDPOINT itself, which a shell may set for other applications).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${WORKER_OTLP_ENDPOINT:-}
      OTEL_METRIC_EXPORT_INTERVAL: "10000"
    ports:
      # Uncommon port on purpose: 8080, 5000 and similar are usually taken by the main applications.
      - "127.0.0.1:7461:7461"
    # Docker Desktop resolves host.docker.internal by itself; Docker Engine on Linux needs the mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # Must exceed the shutdown budget, which is capped in code: Host:ShutdownTimeout (20 s)
    # + consumer channel close, abort and dispose (3 x 2 s)
    # + consumer and publisher RabbitMQ connections, close and abort each (2 x 2 x 3 s) = 38 s.
    stop_grace_period: 45s
    restart: unless-stopped

  # Optional metrics viewer (OTLP gRPC on 18889): http://localhost:18888. Started only with --profile observability.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.5.2
    profiles: ["observability"]
    environment:
      # Local only (bound to localhost): no login token.
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:18888:18888"
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
